# ARLinux 调试 / 自动化通道（只监听回环地址的 sshd）。
#
# 实例没有物理键盘，应用界面也不能执行 shell 命令，所以镜像自带这份配置，
# 由 desktop.sh 在每次会话启动时拉起 sshd；监听 127.0.0.1，只接受公钥登录。
#
# 使用（在电脑上）：
#   adb forward tcp:2222 tcp:2222
#   ssh -p 2222 root@127.0.0.1
# 前提：把自己的公钥写进实例的 /root/.ssh/authorized_keys，例如
#   adb shell 之外的 guest 终端里：install -d -m700 /root/.ssh && cat >> /root/.ssh/authorized_keys
# 或者先在 guest 终端里执行一次：
#   mkdir -p /root/.ssh && echo '<你的公钥>' >> /root/.ssh/authorized_keys
Port 2222
ListenAddress 127.0.0.1
PermitRootLogin yes
PubkeyAuthentication yes
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitEmptyPasswords no
UsePAM no
StrictModes no
PidFile /run/sshd.pid
LogLevel VERBOSE
