# ARLinux · 点按/触摸优先的 Noctalia 布局。
#
# desktop.sh 每次会话把它写入 $XDG_CONFIG_HOME/noctalia/00-arlinux.toml：Noctalia 只读
# 配置目录里的 *.toml 并按字母序合并，因此本文件先加载，用户自己的 config.toml 等在其后
# 加载、始终优先；GUI 改动的 settings.toml 最后加载。
#
# 设计前提：本实例没有物理键盘，操作全部通过点按完成；宿主在屏幕右边缘另有一条手势
# 竖条（轻点=键盘，双击=应用抽屉，长按=AI 语音）。固定项写桌面项 ID（文件名去掉
# .desktop 后缀，如 zen），这是 Noctalia 5.3 的精确匹配规则。

[theme]
# 与 kitty 的 Catppuccin Frappe 对齐：调色板 JSON 随镜像提供（离线可用），
# desktop.sh 每次会话装到 $XDG_CONFIG_HOME/noctalia/palettes/，这里按文件名引用。
mode              = "dark"
shell_mode        = "follow"
source            = "custom"
custom_palette    = "Catppuccin Frappe"
pure_black_dark   = false
sync_color_scheme = true

[accessibility]
# 面板类界面（启动器、控制中心、剪贴板等）整体放大，适合手指点选。
ui_scale = 1.25

[plugins]
# 关闭插件源的后台 git 更新（启动时 + 每 6 小时）：既省内存和 CPU，也让
# “Noctalia 一启动就 git fetch 两个插件源”的常驻下载进程消失。
auto_update = "none"

[shell]
# 预置镜像不需要首启向导（它面向键盘操作）。
setup_wizard_enabled = false
# 宿主合成器不实现模糊，Noctalia 的投影会渲染成不透明黑框（dock、顶栏、面板、
# 弹层都一样），所以全关：这里管弹层/下拉，[shell.shadow] 把全局阴影透明度
# 归零，[shell.panel] 与 [bar.default] 各自再显式关一次。窗口一侧的黑框来自
# 宿主自己的窗口装饰，由 desktop.sh 写宿主 Lua 配置关掉。
popup_shadows = false

[shell.shadow]
# 全局阴影（dock/顶栏/面板共用），0 = 不渲染。
alpha = 0.0

[shell.panel]
# 悬浮/吸附面板（控制中心、启动器等）：不投阴影、不透明（无模糊时 glass
# 只会把面板调得更浑浊）。
shadow            = false
transparency_mode = "solid"

[shell.launcher]
# 应用启动器：图标网格，打开即进入全部应用视图。
layout       = "full"
app_grid     = true
default_view = "all"
width        = 1000
pinned       = ["arlinux-apps", "kitty", "zen", "zcode"]

[osd]
# 音量/亮度等提示条放大，便于阅读。
scale = 1.25

[bar.default]
position           = "top"
thickness          = 56
scale              = 1.25
padding            = 12
widget_spacing     = 12
margin_ends        = 10
background_opacity = 0.94
# 触屏没有 hover，关掉悬停提示。
show_tooltip       = false
# 不投全局阴影（宿主不画模糊，阴影就是一圈不透明黑框）；与面板相接处的渐变
# 阴影（contact_shadow）也一并关掉；栏自己也不申请合成器模糊区域。
shadow             = false
contact_shadow     = false
compositor_blur    = false
# 没有窗口切换按钮：它的预览会请求窗口截图（ext-image-copy-capture），而宿主
# 合成器这条路径会空指针崩溃、连带整个会话退出。切换窗口用 dock/taskbar 的
# 运行中应用图标（点一下聚焦），备选是 guest/bin/arlinux-dock 的 nwg-dock。
start              = ["launcher", "apps", "term", "close", "diag"]
center             = ["taskbar"]
end                = ["clock", "volume", "battery", "control-center"]

[dock]
# 底部 dock 放置常用应用：点图标启动/切换，右键菜单固定或取消固定。
# 第一个磁贴就是 ARLinux 的 Apps 抽屉（固定项第一项）；不显示 launcher 按钮，
# 所以 dock 上不会出现额外的网格图标。
#
# 悬浮模式：reserve_space = false，不向合成器申请独占区，应用窗口用满整屏高度。
# 宿主合成器不画模糊，全局阴影会渲染成硬边黑框，所以关掉 shadow、描边宽度归零。
enabled            = true
position           = "bottom"
icon_size          = 56
item_spacing       = 12
background_opacity = 0.88
border_width       = 0
shadow             = false
radius             = 22
margin_edge        = 14
margin_ends        = 150
show_running       = true
reserve_space      = false
show_dots          = true
# 触屏没有指针：非活动图标不缩小，活动图标只轻微放大。
inactive_scale     = 1.0
active_scale       = 1.06
magnification      = false
launcher_position  = "none"
pinned             = ["arlinux-apps", "kitty", "zen", "zcode", "nemo"]

# —— 点一下就能完成的操作 ——

[widget.launcher]
type = "launcher"

[widget.taskbar]
# 点图标=切换窗口（中键关闭在触屏上不可用，关闭走下面的按钮）。固定项与 dock 共用
# 同一套匹配规则，写桌面项 ID。
type             = "taskbar"
show_running     = true
show_all_outputs = true
icon_scale       = 1.3
item_spacing     = 12
pinned           = ["kitty", "zen", "zcode", "arlinux-apps"]

[widget.apps]
# ARLinux 应用抽屉（框架提供的触摸网格；双击右边缘竖条是同一个程序）。
type    = "custom_button"
glyph   = "apps"
tooltip = "应用抽屉（Apps）"

[widget.apps.actions]
left = "exec /usr/local/bin/arlinux-apps"

[widget.term]
type    = "custom_button"
glyph   = "terminal-2"
tooltip = "终端"

[widget.term.actions]
left = "exec kitty"

[widget.close]
# 与 super+Q 等价：关闭当前窗口。宿主合成器不画窗口装饰，所以关闭入口放在这里。
# 命令走 arlinux-window：它在 Lua 与经典两套派发器之间自动回退。
type    = "custom_button"
glyph   = "x"
tooltip = "关闭当前窗口"

[widget.close.actions]
left = "exec /usr/bin/arlinux-window close"

[widget.diag]
# 会话诊断（合成器状态、窗口列表、输入法、配置校验、退出记录），排障时点它。
type    = "custom_button"
glyph   = "stethoscope"
tooltip = "桌面诊断"

[widget.diag.actions]
left = "exec kitty --hold -e /usr/local/bin/arlinux-diag"
