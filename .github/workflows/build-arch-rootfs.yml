name: Build Arch rootfs

# Hosted single-repository entry for this fork's Arch distribution. It runs
# the canonical `./build.sh rootfs` pipeline on an ARM64 runner instead of
# dispatching the per-component workflows that live in the upstream
# repositories. It is not a second builder: every step below calls the
# documented entry points.

on:
  workflow_dispatch:
    inputs:
      cache:
        description: Reuse the Actions build cache (uncheck to force a cold build)
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: arch-rootfs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  rootfs:
    name: Arch rootfs (ARM64)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      # Deliberately short: the seed stage starts GnuPG against a homedir under
      # this cache, and gpg-agent fails ("General error") when the resulting
      # UNIX socket path exceeds the 108-byte sun_path limit. A deep workspace
      # path is long enough to break it; /opt/al keeps the margin.
      ARLINUX_CACHE_DIR: /opt/al
    steps:
      - name: Check out this fork with the GPU submodules
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          submodules: true
          fetch-depth: 1
          persist-credentials: false

      - name: Prepare the short build cache
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /opt/al
          sudo chown -R "$(id -u):$(id -g)" /opt/al

      - name: Install the build host
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            autoconf automake libtool build-essential bison flex curl git cmake \
            ninja-build patchelf pkg-config python3 python3-venv python3-pip \
            python3-mako python3-zstandard debootstrap util-linux zstd \
            libarchive-tools jq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            glslang-tools wayland-protocols libfreetype-dev libexpat1-dev \
            libwayland-dev libwayland-egl-backend-dev libx11-dev libx11-xcb-dev \
            libxcb1-dev libegl-dev libgl-dev libgles-dev libglvnd-dev \
            libvulkan-dev libdrm-dev libxrandr-dev libxfixes-dev \
            libxshmfence-dev libxxf86vm-dev libxcb-dri3-dev libxcb-present-dev \
            libxcb-sync-dev libxcb-glx0-dev libxcb-dri2-0-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev libxcb-randr0-dev libxdamage-dev libxext-dev \
            libelf-dev libudev-dev libgbm-dev gperf libglib2.0-dev \
            libglib2.0-dev-bin ccache gettext libgettextpo-dev libssl-dev \
            unzip autopoint intltool python-is-python3 file
          python3 -m venv "$RUNNER_TEMP/arlinux-python"
          "$RUNNER_TEMP/arlinux-python/bin/pip" install --quiet \
            zstandard==0.25.0 meson==1.12.0 mako==1.3.10 packaging==25.0 PyYAML==6.0.2
          mkdir -p "$RUNNER_TEMP/arlinux-bin"
          cat > "$RUNNER_TEMP/arlinux-bin/aarch64-linux-gnu-pkg-config" <<'WRAP'
          #!/bin/sh
          export PKG_CONFIG_LIBDIR=/usr/lib/aarch64-linux-gnu/pkgconfig:/usr/share/pkgconfig
          exec pkg-config "$@"
          WRAP
          chmod +x "$RUNNER_TEMP/arlinux-bin/aarch64-linux-gnu-pkg-config"
          {
            echo "$RUNNER_TEMP/arlinux-python/bin"
            echo "$RUNNER_TEMP/arlinux-bin"
          } >> "$GITHUB_PATH"

      - name: Restore the build cache
        if: ${{ inputs.cache }}
        uses: actions/cache/restore@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /opt/al
            build/linux
            build/pipeline
          key: arlinux-arch-${{ runner.arch }}-${{ hashFiles('distributions/arch/**', 'tools/build/**', 'runtime/tools/**') }}-${{ github.run_id }}
          restore-keys: |
            arlinux-arch-${{ runner.arch }}-${{ hashFiles('distributions/arch/**', 'tools/build/**', 'runtime/tools/**') }}-
            arlinux-arch-${{ runner.arch }}-

      - name: Fetch the published capture product
        shell: bash
        run: |
          set -euo pipefail
          # The pipeline consumes the verified vulkan-capture capsule that the
          # owning public repository publishes; building it locally is a
          # separate component workflow. Only the capture payload is imported.
          gh api "repos/taowen/gfxreconstruct/releases/tags/arlinux-vulkan-capture-debug" \
            --jq '.assets[] | select(.name == "component.json") | .browser_download_url' \
            > "$RUNNER_TEMP/capture-manifest-url"
          test -s "$RUNNER_TEMP/capture-manifest-url"
          curl -fsSL --retry 5 --retry-delay 3 -o "$RUNNER_TEMP/component.json" \
            "$(cat "$RUNNER_TEMP/capture-manifest-url")"
          python3 - "$RUNNER_TEMP/component.json" "$RUNNER_TEMP/capture" <<'PY'
          import hashlib, json, pathlib, subprocess, sys, urllib.request
          manifest, out = pathlib.Path(sys.argv[1]), pathlib.Path(sys.argv[2])
          record = json.loads(manifest.read_text())
          out.mkdir(parents=True, exist_ok=True)
          parts = []
          for index, part in enumerate(record['parts']):
              target = out / f'part-{index:03d}'
              urllib.request.urlretrieve(part['url'], target)
              actual = hashlib.sha256(target.read_bytes()).hexdigest()
              if actual != part['sha256']:
                  raise SystemExit('capture capsule part checksum mismatch: ' + part['name'])
              parts.append(target)
          archive = out / 'capsule.tar.zst'
          with archive.open('wb') as dest:
              for part in parts:
                  dest.write(part.read_bytes())
          if hashlib.sha256(archive.read_bytes()).hexdigest() != record['archiveSha256']:
              raise SystemExit('capture capsule checksum mismatch')
          subprocess.run(['tar', '--zstd', '-xf', str(archive), '-C', str(out)], check=True)
          PY
          test -f "$RUNNER_TEMP/capture/framework/build/artifacts/capture/capture.zip"
          test -f "$RUNNER_TEMP/capture/framework/build/artifacts/capture/capture.json"
          mkdir -p build/artifacts
          cp -a "$RUNNER_TEMP/capture/framework/build/artifacts/capture" build/artifacts/

      - name: Build the Arch distribution
        shell: bash
        run: |
          set -euo pipefail
          sudo git config --system --add safe.directory '*'
          echo '{"format":1,"framework":"'"$PWD"'"}' > "$RUNNER_TEMP/rootfs-config.json"
          sudo -E env PATH="$PATH" HOME="$HOME" ARLINUX_CACHE_DIR="$ARLINUX_CACHE_DIR" \
            bash ./build.sh rootfs --config "$RUNNER_TEMP/rootfs-config.json" \
            --distribution arch --output "$PWD/build/artifacts/rootfs/arch/default.zip"

      - name: Hand the build outputs back to the runner user
        shell: bash
        run: |
          set -euo pipefail
          # The package stage runs as root. Only host build-cache files change
          # owner; guest metadata stays inside snapshot.tar, matching the
          # upstream component workflow.
          sudo chown -R "$(id -u):$(id -g)" build /opt/al

      - name: Verify the bundle
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh validate distributions/arch
          ./build.sh verify build/artifacts/rootfs/arch/default.zip
          ls -l build/artifacts/rootfs/arch/

      - name: Upload the verified bundle
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: arlinux-arch-rootfs
          path: |
            build/artifacts/rootfs/arch/default.zip
            build/artifacts/rootfs/arch/default.json
          if-no-files-found: error
          retention-days: 14

      - name: Save the build cache
        if: ${{ success() }}
        continue-on-error: true
        uses: actions/cache/save@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            /opt/al
            build/linux
            build/pipeline
          key: arlinux-arch-${{ runner.arch }}-${{ hashFiles('distributions/arch/**', 'tools/build/**', 'runtime/tools/**') }}-${{ github.run_id }}
